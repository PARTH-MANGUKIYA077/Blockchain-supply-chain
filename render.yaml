services:
  - type: web
    name: blockchain-supply-chain
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: RPC_URL
        value: http://127.0.0.1:8545
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
